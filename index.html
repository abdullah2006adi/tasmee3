<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كشف التسميع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a teacher's marking desk — roster column beside the ayah sheet; every ayah carries its grade + pronunciation box, like the Excel rows */
:root{
  --bg:#eaf0ee; --surface:#fbfdfc; --sunk:#e1e9e6; --ink:#10302a; --muted:#566d67; --line:#cad8d3;
  --accent:#0b6656; --accent-ink:#f3fbf8; --accent-soft:#d3e9e2; --gold:#9c6a17;
  --g2:#1b7a45; --g2s:#d9eee1; --g1:#a46500; --g1s:#f5e6c4; --g0:#b33c28; --g0s:#f6dad3; --on:#ffffff;
  --f-ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-quran:"Amiri Quran","Amiri","Traditional Arabic","Scheherazade New",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1513; --surface:#132019; --sunk:#0f1a17; --ink:#e2ece8; --muted:#92a8a1; --line:#25352f;
  --accent:#3fb39d; --accent-ink:#04201a; --accent-soft:#173a32; --gold:#d6a453;
  --g2:#4cc07d; --g2s:#173826; --g1:#e2ad45; --g1s:#3a2e14; --g0:#ef7059; --g0s:#3d1d17; --on:#07130f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1513; --surface:#132019; --sunk:#0f1a17; --ink:#e2ece8; --muted:#92a8a1; --line:#25352f;
  --accent:#3fb39d; --accent-ink:#04201a; --accent-soft:#173a32; --gold:#d6a453;
  --g2:#4cc07d; --g2s:#173826; --g1:#e2ad45; --g1s:#3a2e14; --g0:#ef7059; --g0s:#3d1d17; --on:#07130f;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;color:var(--accent);letter-spacing:0}
.brand small{color:var(--muted);font-size:.8rem}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tab{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#saved{font-size:.78rem;color:var(--muted);min-width:70px;text-align:left}
#saved::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g2);margin-inline-end:6px;vertical-align:middle}
#saved.bad{color:var(--g0)} #saved.bad::before{background:var(--g0)}

main{padding-block:20px 60px;display:grid;gap:16px}
.view{display:grid;gap:16px}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:.9rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0 0 12px}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.cols > .panel:last-child{grid-column:1/-1}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:.8rem;color:var(--muted);font-weight:500}
.fld em{font-style:normal;font-weight:400;opacity:.85}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.fld textarea{resize:vertical;line-height:1.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.filebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid transparent;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;background:var(--sunk);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{background:transparent;color:var(--g0);border-color:var(--line)}
.btn.armed{background:var(--g0);color:var(--on);border-color:var(--g0)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted);font-size:.85rem}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.tag{font-size:.72rem;background:var(--g1s);color:var(--g1);padding:1px 8px;border-radius:999px;font-weight:600}
.clist{list-style:none;margin:0;padding:0;display:grid}
.clist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.clist li:first-child{border-top:0}
.clist small{display:block;color:var(--muted);font-size:.8rem}
.clist .act{display:flex;gap:6px}

/* recite toolbar */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.bar .fld{flex:1 1 150px}
.bar .fld.grow{flex:2 1 220px}
.bar .fld.sm{flex:0 1 92px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;width:100%}
.chips > span{font-size:.8rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:.82rem;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* workspace */
.work{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.roster{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 100px);overflow:auto;padding:0}
.rhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 8px;position:sticky;top:0;background:var(--surface)}
.rhead small{color:var(--muted);font-size:.78rem}
.roster ol{list-style:none;margin:0;padding:0 6px 8px}
.roster li button{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;text-align:right;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer}
.roster li button:hover{background:var(--sunk)}
.roster li.on button{background:var(--accent-soft)}
.roster .n{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.roster .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--muted)}
.pill.hi{background:var(--g2s);color:var(--g2)} .pill.mid{background:var(--g1s);color:var(--g1)} .pill.lo{background:var(--g0s);color:var(--g0)}
.mobile-only{display:none}

.sheet{padding:0;overflow:hidden}
.stu-head{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;padding:18px 18px 12px}
.stu-head small{color:var(--muted)}
.stu-head h2{font-family:var(--f-display);font-size:1.6rem;margin:2px 0 0;font-weight:700}
.nav{display:flex;gap:6px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-block:1px solid var(--line);background:var(--bg)}
.st{padding:10px 14px;border-inline-start:1px solid var(--line);display:grid}
.st:first-child{border-inline-start:0}
.st > span{font-size:.75rem;color:var(--muted)}
.st b{font-size:1.35rem;font-variant-numeric:tabular-nums;font-weight:600}
.st b i{font-style:normal;font-size:.8rem;color:var(--muted);font-weight:400}
.st.key b{color:var(--accent)}
.prog{grid-column:1/-1;border-top:1px solid var(--line);padding:6px 14px;display:flex;gap:10px;align-items:center}
.prog .track{flex:1;height:5px;background:var(--sunk);border-radius:9px;overflow:hidden}
.prog .track span{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .2s}
.prog small{font-size:.75rem;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;justify-content:space-between;align-items:center}
.tools .legend{font-size:.8rem;color:var(--muted)}
.basmala{font-family:var(--f-quran);text-align:center;font-size:1.5rem;color:var(--muted);margin:4px 0 6px}

.ayat{list-style:none;margin:0;padding:0}
.ayah{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.atext{font-family:var(--f-quran);font-size:1.6rem;line-height:2.15;margin:0}
.anum{font-size:1.15rem;color:var(--gold);white-space:nowrap}
.ctrl{display:grid;gap:6px;width:300px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-inline-start:1px solid var(--line);background:var(--surface);padding:5px 4px;cursor:pointer;display:grid;line-height:1.25}
.seg button:first-child{border-inline-start:0}
.seg button b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.seg button span{font-size:.7rem;color:var(--muted)}
.seg button:hover{background:var(--sunk)}
.seg button[data-v="2"][aria-pressed="true"]{background:var(--g2);color:var(--on)}
.seg button[data-v="1"][aria-pressed="true"]{background:var(--g1);color:var(--on)}
.seg button[data-v="0"][aria-pressed="true"]{background:var(--g0);color:var(--on)}
.seg button[aria-pressed="true"] span{color:inherit;opacity:.9}
.err{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--bg)}
.err span{font-size:.72rem;color:var(--muted);white-space:nowrap}
.err input{border:0;background:transparent;padding:7px 0;flex:1;min-width:0;outline:none}
.err:focus-within{border-color:var(--accent)}
.ayah.has-err .err{border-color:var(--g0);background:var(--g0s)}
.ayah.has-err .err span{color:var(--g0);font-weight:600}
.ayah.has-err .err span::after{content:" −١"}

/* results */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile span{font-size:.78rem;color:var(--muted)}
.tile b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;font-weight:600}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.res{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:.88rem;min-width:100%}
.res th,.res td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--surface)}
.res thead th{background:var(--sunk);font-weight:600;font-size:.78rem;position:sticky;top:0}
.res th.nm,.res td.nm{position:sticky;right:0;z-index:1;text-align:right;border-inline-end:1px solid var(--line);min-width:150px}
.res thead th.nm{z-index:2}
.res td.nm button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.res th.ay{min-width:46px;line-height:1.3}
.res th.ay small{display:block;font-weight:400;color:var(--muted);font-size:.68rem;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.res td.c{font-weight:600}
.res td.c2{color:var(--g2)} .res td.c1{color:var(--g1);background:var(--g1s)} .res td.c0{color:var(--g0);background:var(--g0s)}
.res td.e{position:relative}
.res td.e::after{content:"";position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:50%;background:var(--g0)}
.res .sum{border-inline-start:2px solid var(--line)}
.res td.fin{font-weight:700;color:var(--accent)}
.res td.rank{font-weight:700}
.res tr.nt td{color:var(--muted)}
.errlog{columns:2 320px;column-gap:28px}
.errlog div{break-inside:avoid;margin-bottom:10px}
.errlog b{display:block}
.errlog ul{margin:2px 0 0;padding-inline-start:18px;color:var(--muted);font-size:.9rem}

#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--g0);color:var(--on)}
.foot{color:var(--muted);font-size:.78rem;text-align:center;padding-top:24px}

@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .work{grid-template-columns:1fr}
  .roster{display:none}
  .mobile-only{display:block}
  .stu-pick{padding:14px 18px 0}
  .ayah{grid-template-columns:1fr}
  .ctrl{width:100%}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .st:nth-child(4){border-inline-start:0}
  .st:nth-child(n+4){border-top:1px solid var(--line)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){ .brand small,#saved{display:none} .tab{padding:6px 11px} .atext{font-size:1.4rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.bar,.tools,.roster,.no-print{display:none!important} body{background:#fff}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand"><h1>كشف التسميع</h1><small>درجتان لكل آية · خطأ النطق ينقص درجة</small></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="classes">الشُّعب</button>
      <button class="tab" role="tab" data-tab="recite">التسميع</button>
      <button class="tab" role="tab" data-tab="results">النتائج</button>
    </nav>
    <span id="saved">محفوظ</span>
  </div>
</header>

<main class="wrap">
  <div id="demo-banner" class="banner" hidden>
    <span>تظهر الآن شعبة <b>مثال</b> لتجربة الأداة. احذفها من تبويب «الشُّعب» بعد إضافة شعبك.</span>
  </div>
  <section id="v-classes" class="view" hidden></section>
  <section id="v-recite" class="view" hidden></section>
  <section id="v-results" class="view" hidden></section>
  <p class="foot">النص القرآني بالرسم العثماني من مشروع تنزيل (tanzil.net). البيانات محفوظة في هذا المتصفح.</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="quran.js"></script>
<script>
(function(){
'use strict';
const Q = window.QURAN || [];
const KEY = 'tasmee3-v1';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AR[d]);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const r1 = x => Math.round(x * 10) / 10;
const fmt = x => String(r1(x));
const cnt = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10) ? n + ' ' + few : n + ' ' + many;

if (!Q.length) { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:20px;color:#b33c28">تعذّر تحميل ملف النص القرآني quran.js — تأكد أنه بجانب index.html.</p>'); return; }

/* ---------- state ---------- */
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
if (!S || !Array.isArray(S.classes) || !Array.isArray(S.sheets)) S = demo();
S.ui = Object.assign({ tab: 'recite', sheet: null, student: null, editClass: null, resSheet: null, resSort: 'list', lastClass: null, lastSurah: 64 }, S.ui || {});

function demo() {
  const names = ['محمد أحمد', 'عبدالله خالد', 'يوسف علي', 'عمر سالم', 'حمد ناصر', 'فهد راشد'];
  const students = names.map(n => ({ id: uid(), name: n }));
  const c = { id: uid(), grade: 'تاسع', section: '(مثال)', demo: true, students };
  const sh = { id: uid(), classId: c.id, surah: 64, from: 1, to: 18, date: today(), recs: {} };
  const o = a => { const r = {}; a.forEach((v, i) => r[i + 1] = v); return r; };
  sh.recs[students[0].id] = { s: o([2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2,2]), e: {} };
  sh.recs[students[1].id] = { s: o([2,2,1,2,2,2,1,2,2,2,2,2,1,2,2,2,2,2]), e: { 4: 'المدّ في «يعلم»' } };
  sh.recs[students[2].id] = { s: o([2,1,1,2,0,2,1,2,1,2,2,0,1,2,2,1,0,0]), e: { 2: 'تشكيل «فمنكم»', 11: 'مخرج الصاد في «أصاب»' } };
  return { classes: [c], sheets: [sh], ui: { tab: 'recite', sheet: sh.id, student: students[1].id, lastClass: c.id, lastSurah: 64 } };
}

let saveT;
function save(now) {
  clearTimeout(saveT);
  const go = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); setSaved('محفوظ'); } catch (e) { setSaved('تعذّر الحفظ', true); } };
  if (now) go(); else { setSaved('جارٍ الحفظ…'); saveT = setTimeout(go, 300); }
}
function setSaved(t, bad) { const el = $('#saved'); el.textContent = t; el.classList.toggle('bad', !!bad); }
let toastT;
function toast(t, bad) { const el = $('#toast'); el.textContent = t; el.classList.toggle('bad', !!bad); el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2800); }

/* ---------- helpers ---------- */
const cls = id => S.classes.find(c => c.id === id);
const sheetById = id => S.sheets.find(s => s.id === id);
const cname = c => c ? (c.grade + ' ' + c.section).trim() : '(شعبة محذوفة)';
const sname = n => Q[n - 1][0];
const fullRange = sh => sh.from === 1 && sh.to === Q[sh.surah - 1][1].length;
const rangeTxt = sh => fullRange(sh) ? 'كاملة' : 'الآيات ' + sh.from + '–' + sh.to;
const sheetLabel = sh => cname(cls(sh.classId)) + ' · ' + sname(sh.surah) + (fullRange(sh) ? '' : ' (' + sh.from + '–' + sh.to + ')') + ' · ' + sh.date;
const cur = () => S.ui.sheet && sheetById(S.ui.sheet);

function calc(sh, sid) {
  const r = sh.recs[sid] || { s: {}, e: {} };
  const n = sh.to - sh.from + 1;
  let sum = 0, c2 = 0, c1 = 0, c0 = 0, err = 0, touched = false;
  for (let a = sh.from; a <= sh.to; a++) {
    const v = r.s[a];
    if (v === 2) { c2++; sum += 2; } else if (v === 1) { c1++; sum += 1; } else if (v === 0) { c0++; }
    if ((r.e[a] || '').trim()) err++;
  }
  touched = (c2 + c1 + c0 + err) > 0;
  const pct = n ? sum * 100 / (2 * n) : 0;
  const fin = Math.max(0, pct - err);
  const oral = fin >= 80 ? 6 : fin >= 70 ? 5 : fin >= 60 ? 4 : fin >= 40 ? 3 : fin >= 20 ? 2 : fin >= 1 ? 1 : 0;
  return { n, sum, c2, c1, c0, err, pct, fin, oral, touched, done: c2 + c1 + c0 };
}
function rankMap(sh, studs) {
  const list = studs.map(s => ({ id: s.id, k: calc(sh, s.id) })).filter(x => x.k.touched);
  const m = {};
  list.forEach(x => { m[x.id] = 1 + list.filter(y => r1(y.k.fin) > r1(x.k.fin)).length; });
  return m;
}
const band = f => f >= 80 ? 'hi' : f >= 60 ? 'mid' : 'lo';

function arm(btn, fn) {

}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;

/* ---------- names ---------- */
function parseNames(t) {
  const seen = new Set();
  return t.split(/\r?\n/)
    .map(l => l.replace(/^[\s\d٠-٩.\-)(:،,]+/, '').replace(/\s+/g, ' ').trim())
    .filter(n => n && !/^(الاسم|اسم الطالب|الأسماء|أسماء الطلاب)$/.test(n) && !seen.has(n) && seen.add(n));
}
async function readNamesFile(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  let rows = [];
  if (ext === 'xlsx' || ext === 'xls') {
    if (!window.XLSX) throw new Error('nolib');
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
  } else {
    rows = (await f.text()).split(/\r?\n/).map(l => l.split(/[\t,;]/));
  }
  const out = [];
  for (const r of rows) {
    const cell = r.map(x => String(x).trim())
      .filter(x => x && /[؀-ۿA-Za-z]/.test(x) && !/^[\d٠-٩]+$/.test(x) && !x.startsWith('='))
      .sort((a, b) => b.length - a.length)[0];
    if (cell) out.push(cell);
  }
  return out;
}

    ['الدرجة النهائية', fmt(k.fin)],
    ['درجة الشفوي', `${k.oral}<i> / 6</i>`]
  ].map(([l, v], i) => `<div class="st${i === 3 ? ' key' : ''}"><span>${l}</span><b>${v}</b></div>`).join('') +
    `<div class="prog"><div class="track"><span style="width:${k.n ? k.done / k.n * 100 : 0}%"></span></div><small>قُيِّمت ${k.done} من ${k.n} آية · ${k.c2} بلا تذكير · ${k.c1} مع تذكير · ${k.c0} لم يسمع</small></div>`;
}

/* ---------- view: results ---------- */
function rResults() {
  const v = $('#v-results');
  if (!S.sheets.length) { v.innerHTML = '<section class="panel"><p class="empty">لا توجد كشوف بعد. افتح كشفاً من تبويب «التسميع».</p></section>'; return; }
  let sh = sheetById(S.ui.resSheet) || cur() || S.sheets[S.sheets.length - 1];
  S.ui.resSheet = sh.id;
  const c = cls(sh.classId), studs = c ? c.students : [];
  const rk = rankMap(sh, studs);
  let rows = studs.map((s, i) => ({ s, i, k: calc(sh, s.id) }));
  if (S.ui.resSort === 'rank') rows.sort((a, b) => (rk[a.s.id] || 1e9) - (rk[b.s.id] || 1e9) || a.i - b.i);
  const ev = rows.filter(x => x.k.touched);
  const avg = ev.length ? ev.reduce((t, x) => t + x.k.fin, 0) / ev.length : 0;
  const best = ev.length ? Math.max(...ev.map(x => x.k.fin)) : 0;
  const errs = ev.reduce((t, x) => t + x.k.err, 0);
  const labels = Q[sh.surah - 1][2];
  let ah = '';
  for (let a = sh.from; a <= sh.to; a++) ah += `<th class="ay" title="${esc(labels[a - 1])}">${a}<small>${esc(labels[a - 1])}</small></th>`;

  const body = rows.map(({ s, i, k }) => {
    const r = sh.recs[s.id] || { s: {}, e: {} };
    let cells = '';
    for (let a = sh.from; a <= sh.to; a++) {
      const x = r.s[a], e = (r.e[a] || '').trim();
      cells += `<td class="c${x != null ? ' c' + x : ''}${e ? ' e' : ''}"${e ? ` title="خطأ النطق: ${esc(e)}"` : ''}>${x != null ? x : ''}</td>`;
    }
    const t = k.touched;
    return `<tr${t ? '' : ' class="nt"'}><td>${i + 1}</td><td class="nm"><button type="button" data-open="${s.id}">${esc(s.name)}</button></td>${cells}
      <td class="sum">${t ? k.sum : '—'}</td><td>${t ? fmt(k.pct) + '%' : '—'}</td><td>${t ? k.c2 : ''}</td><td>${t ? k.c1 : ''}</td><td>${t ? k.c0 : ''}</td><td>${t ? k.err : ''}</td>
      <td class="fin">${t ? fmt(k.fin) : '—'}</td><td>${t ? k.oral : '—'}</td><td class="rank">${rk[s.id] || ''}</td></tr>`;
  }).join('');

  const log = rows.filter(x => Object.values((sh.recs[x.s.id] || { e: {} }).e).some(e => (e || '').trim()))
    .map(({ s }) => {
      const e = sh.recs[s.id].e;
      const items = Object.keys(e).map(Number).filter(a => a >= sh.from && a <= sh.to && (e[a] || '').trim()).sort((a, b) => a - b);
      return items.length ? `<div><b>${esc(s.name)}</b><ul>${items.map(a => `<li>الآية ${a}: ${esc(e[a])}</li>`).join('')}</ul></div>` : '';
    }).join('');

  v.innerHTML = `
    <section class="panel bar">
      <label class="fld grow"><span>الكشف</span><select id="x-sheet">${S.sheets.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(s => `<option value="${s.id}"${s.id === sh.id ? ' selected' : ''}>${esc(sheetLabel(s))}</option>`).join('')}</select></label>
      <label class="fld"><span>ترتيب الجدول</span><select id="x-sort"><option value="list"${S.ui.resSort === 'list' ? ' selected' : ''}>حسب القائمة</option><option value="rank"${S.ui.resSort === 'rank' ? ' selected' : ''}>حسب أفضل تسميع</option></select></label>
      <button class="btn primary" id="x-xlsx">تصدير إلى Excel</button>
      <button class="btn ghost" id="x-edit">فتح في التسميع</button>
      <button class="btn danger" id="x-del" data-msg="حذف هذا الكشف؟">حذف الكشف</button>
    </section>
    <div class="tiles">
      <div class="tile"><span>المسمَّعون</span><b>${ev.length} / ${studs.length}</b></div>
      <div class="tile"><span>متوسط الدرجة النهائية</span><b>${ev.length ? fmt(avg) : '—'}</b></div>
      <div class="tile"><span>أعلى درجة</span><b>${ev.length ? fmt(best) : '—'}</b></div>
      <div class="tile"><span>أخطاء النطق في الشعبة</span><b>${errs}</b></div>
    </div>
    <div class="tscroll"><table class="res">
      <thead><tr><th>م</th><th class="nm">اسم الطالب</th>${ah}<th class="sum">المجموع</th><th>النسبة</th><th>بلا تذكير</th><th>مع تذكير</th><th>لم يسمع</th><th>أخطاء النطق</th><th>الدرجة النهائية</th><th>درجة الشفوي</th><th>الترتيب</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <p class="hint" style="margin:0">الدرجة النهائية = النسبة − عدد أخطاء النطق. درجة الشفوي من 6: ‎80 فأكثر = 6، ‎70 = 5، ‎60 = 4، ‎40 = 3، ‎20 = 2، أقل من ذلك = 1. النقطة الحمراء تعني خطأ نطق (مرّر المؤشر لقراءته).</p>
    <section class="panel"><h2>سجل أخطاء النطق</h2>${log ? `<div class="errlog">${log}</div>` : '<p class="muted" style="margin:0">لا توجد أخطاء نطق مسجّلة في هذا الكشف.</p>'}</section>`;

  $('#x-sheet').addEventListener('change', e => { S.ui.resSheet = e.target.value; save(); rResults(); });
  $('#x-sort').addEventListener('change', e => { S.ui.resSort = e.target.value; save(); rResults(); });
  $('#x-xlsx').addEventListener('click', () => exportXlsx(sh));
  $('#x-edit').addEventListener('click', () => { S.ui.sheet = sh.id; S.ui.tab = 'recite'; save(); render(); window.scrollTo(0, 0); });
  $('#x-del').addEventListener('click', e => arm(e.currentTarget, () => {
    S.sheets = S.sheets.filter(s => s.id !== sh.id);
    if (S.ui.sheet === sh.id) S.ui.sheet = null;
    S.ui.resSheet = null; save(true); rResults(); toast('حُذف الكشف');
  }));
  $$('[data-open]', v).forEach(b => b.addEventListener('click', () => { S.ui.sheet = sh.id; S.ui.student = b.dataset.open; S.ui.tab = 'recite'; save(); render(); window.scrollTo(0, 0); }));
}

function exportXlsx(sh) {
  if (!window.XLSX) { toast('تعذّر تحميل مكتبة Excel، تحقق من الاتصال بالإنترنت', true); return; }
  const c = cls(sh.classId), studs = c.students, rk = rankMap(sh, studs), labels = Q[sh.surah - 1][2];
  const title = 'كشف تسميع سورة: {' + sname(sh.surah) + '} ' + cname(c);
  const sum = [[title], ['تاريخ التقييم: ' + sh.date, '', 'الآيات: ' + sh.from + '–' + sh.to], [],
    ['م', 'اسم الطالب', 'المجموع', 'النسبة %', 'بلا تذكير', 'مع تذكير', 'لم يسمع', 'أخطاء النطق', 'الدرجة النهائية', 'درجة الشفوي', 'الترتيب']];
  studs.forEach((s, i) => { const k = calc(sh, s.id), t = k.touched;
    sum.push([i + 1, s.name, t ? k.sum : '', t ? r1(k.pct) : '', t ? k.c2 : '', t ? k.c1 : '', t ? k.c0 : '', t ? k.err : '', t ? r1(k.fin) : '', t ? k.oral : '', rk[s.id] || '']); });

  const det = [['م', 'اسم الطالب', 'عناوين', title]], merges = [];
  studs.forEach((s, i) => {
    const r = sh.recs[s.id] || { s: {}, e: {} }, h = ['', '', 'الآية'], g = ['', '', 'الدرجة'], e = ['', '', 'خطأ النطق'];
    for (let a = sh.from; a <= sh.to; a++) { h.push(a + labels[a - 1]); g.push(r.s[a] != null ? r.s[a] : ''); e.push((r.e[a] || '').trim()); }
    h[0] = i + 1; h[1] = s.name;
    const row = det.length;
    det.push(h, g, e);
    merges.push({ s: { r: row, c: 0 }, e: { r: row + 2, c: 0 } }, { s: { r: row, c: 1 }, e: { r: row + 2, c: 1 } });
  });
  const wb = XLSX.utils.book_new();
  const w1 = XLSX.utils.aoa_to_sheet(sum);
  w1['!cols'] = [{ wch: 5 }, { wch: 28 }].concat(Array(9).fill({ wch: 12 }));
  const w2 = XLSX.utils.aoa_to_sheet(det);
  w2['!merges'] = merges;
  w2['!cols'] = [{ wch: 5 }, { wch: 26 }, { wch: 10 }].concat(Array(sh.to - sh.from + 1).fill({ wch: 13 }));
  XLSX.utils.book_append_sheet(wb, w1, 'النتائج');
  XLSX.utils.book_append_sheet(wb, w2, 'الكشف التفصيلي');
  wb.Workbook = { Views: [{ RTL: true }] };
  try { XLSX.writeFile(wb, 'تسميع ' + sname(sh.surah) + ' ' + cname(c) + ' ' + sh.date + '.xlsx'); toast('نُزّل ملف Excel'); }
  catch (err) { toast('تعذّر تنزيل الملف من هذه الصفحة', true); }
}

render();
save(true);
})();
</script>
</body>
</html>
